; PlatformIO project configuration for WATTWISE DZ ESP32 firmware
;
; Build:    pio run -e esp32dev
; Upload:   pio run -e esp32dev -t upload
; Monitor:  pio device monitor
;
; TEST_MODE: set build_flags = -DTEST_MODE=1 for simulation (no hardware)
;            remove build_flags or set -DTEST_MODE=0 for real hardware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -DTEST_MODE=1
    -Wall
    -Wextra
lib_deps =
    mandulaj/PZEM-004T-v30@^1.1.2
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    claws/BH1750@^1.3.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    openenergymonitor/EmonLib@^1.1.0

[env:esp32dev-hardware]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -DTEST_MODE=0
    -Wall
    -Wextra
lib_deps = ${env:esp32dev.lib_deps}

[pio_check]
check_tool = none
